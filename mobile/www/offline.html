<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>QMuraajah: offline</title>
  <style>
    :root { --bg: #f5f3ee; --surface: #fff; --text: #1a1c1a; --muted: #5a5d58; --accent: #1f3d33; --on-accent: #fff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111312; --surface: #1b1e1c; --text: #eef0ec; --muted: #a9ada6; --accent: #cbdcc6; --on-accent: #1a1c1a; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    }
    main { width: 100%; max-width: 360px; background: var(--surface); border-radius: 28px; padding: 32px 24px; text-align: center; }
    .logo { width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 999px; background: #1f3d33; color: #fff; display: grid; place-items: center; font-size: 30px; font-weight: 600; }
    h1 { font-size: 22px; margin: 0 0 8px; font-weight: 600; }
    p { margin: 0 0 24px; color: var(--muted); }
    button { height: 52px; width: 100%; border: 0; border-radius: 999px; background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">م</div>
    <h1>You're offline</h1>
    <p>QMuraajah needs a connection to load your revision. Check your Wi-Fi or mobile data, then try again.</p>
    <button type="button" onclick="location.href='https://dawr.hifzapp.link/today'">Try again</button>
  </main>
</body>
</html>
